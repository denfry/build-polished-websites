name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify package
        run: node build-polished-websites/scripts/verify-package.mjs

      - name: Test Lighthouse gate
        run: node build-polished-websites/scripts/lighthouse-gate.test.mjs

      - name: Test Bash installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n install.sh
          target="$RUNNER_TEMP/install-target"
          mkdir -p "$target"
          bash ./install.sh --agent all --scope project --project-path "$target"
          node "$target/.agents/skills/build-polished-websites/scripts/verify-package.mjs"
          node "$target/.claude/skills/build-polished-websites/scripts/verify-package.mjs"

      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $target = Join-Path $env:RUNNER_TEMP "install-target"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          .\install.ps1 -Agent all -Scope project -ProjectPath $target
          node "$target\.agents\skills\build-polished-websites\scripts\verify-package.mjs"
          node "$target\.claude\skills\build-polished-websites\scripts\verify-package.mjs"
